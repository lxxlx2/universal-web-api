name: Security hardening

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-repo-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m py_compile tools/public_repo_safety_check.py
      - run: python tools/public_repo_safety_check.py

  security-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: >-
          python -m py_compile
          start.py
          start_upstream.py
          security_guard.py
          app/services/client_tool_policy.py
          app/services/tool_calling.py
          app/api/codex_compat.py
      - run: python -m pytest -q tests/test_security_hardening.py

  upstream-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      # Several upstream tests depend on runtime/local files intentionally
      # excluded by the upstream .gitignore. Exclude only those fixture-bound
      # suites/cases so CI exercises every reproducible tracked regression.
      - name: Run reproducible upstream regression tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_arena_auto_battle_command.py
          --ignore=tests/test_arena_command_persistence.py
          --ignore=tests/test_workflow_js_exec_integration.py
          --ignore=tests/test_workflow_script_loader.py
          --deselect=tests/test_arena_direct_models.py::test_collect_model_entries_respects_tab_preset_isolation
          --deselect=tests/test_media_stream_image_precedence.py::test_arena_conversation_image_window_script_sets_placeholder_attrs
