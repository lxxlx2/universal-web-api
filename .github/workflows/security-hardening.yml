name: Security hardening

on:
  push:
    branches:
      - main
      - security-hardening
  pull_request:

permissions:
  contents: read

jobs:
  security-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m py_compile start.py security_guard.py
      - run: python -m pytest -q tests/test_security_hardening.py
