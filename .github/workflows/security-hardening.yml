name: Security hardening

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-repo-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m py_compile tools/public_repo_safety_check.py
      - run: python tools/public_repo_safety_check.py

  security-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: >-
          python -m py_compile
          start.py
          start_upstream.py
          security_guard.py
          tools/codex_desktop_acceptance.py
          tools/codex_large_context_acceptance.py
          tools/codex_large_context_live.py
          tools/codex_auto_compact_trigger_probe.py
          tools/codex_remote_compaction_trigger_probe.py
          tools/codex_remote_compaction_recovery.py
          tools/codex_remote_compaction_recovery_staged.py
          tools/codex_remote_compaction_compat.py
          app/services/client_tool_policy.py
          app/services/tool_calling.py
          app/services/chatgpt_web_mode.py
          app/services/chatgpt_web_prepare.py
          app/services/codex_web_policy.py
          app/services/codex_responses_state.py
          app/services/codex_wire_observability.py
          app/services/codex_web_session_affinity.py
          app/services/codex_remote_compaction_v2.py
          app/services/codex_required_tool_language_patch.py
          app/services/codex_v2_runtime_hardening.py
          app/services/codex_stream_compat.py
          app/services/codex_workspace_refusal_language_patch.py
          app/api/codex_compat.py
          app/api/codex_responses.py
          app/api/codex_responses_v2.py
      - run: python -m pytest -q tests/test_security_hardening.py

  upstream-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      # Some inherited tests depend on runtime/local files intentionally excluded
      # from the public repository. Exclude only those fixture-bound suites/cases
      # so CI exercises every reproducible tracked regression, including Codex
      # continuation persistence and hydration tests.
      - name: Run reproducible regression tests
        run: >-
          python -m pytest -q
          --ignore=tests/test_arena_auto_battle_command.py
          --ignore=tests/test_arena_command_persistence.py
          --ignore=tests/test_workflow_js_exec_integration.py
          --ignore=tests/test_workflow_script_loader.py
          --deselect=tests/test_arena_direct_models.py::test_collect_model_entries_respects_tab_preset_isolation
          --deselect=tests/test_media_stream_image_precedence.py::test_arena_conversation_image_window_script_sets_placeholder_attrs
